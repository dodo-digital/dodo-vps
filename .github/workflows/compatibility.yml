name: Compatibility

on:
  push:
  pull_request:

jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n setup.sh tests/test-setup.sh
      - name: Run Bash compatibility tests
        run: bash tests/test-setup.sh

  windows:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse and run Windows preflight
        shell: ${{ matrix.shell }}
        run: .\tests\test-powershell.ps1
