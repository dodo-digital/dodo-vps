name: Compatibility

on:
  push:
  pull_request:

jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check Bash syntax
        run: bash -n setup.sh tests/test-setup.sh
      - name: Run Bash compatibility tests
        run: bash tests/test-setup.sh

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Download Windows launcher (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          $launcher = Join-Path $env:RUNNER_TEMP 'dodo-vps-setup.ps1'
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/setup.ps1" -OutFile $launcher
          powershell -ExecutionPolicy Bypass -File $launcher -Check
      - name: Download Windows launcher (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $launcher = Join-Path $env:RUNNER_TEMP 'dodo-vps-setup.ps1'
          Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/setup.ps1" -OutFile $launcher
          pwsh -File $launcher -Check
      - name: Parse and run Windows preflight (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\tests\test-powershell.ps1
      - name: Parse and run Windows preflight (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\tests\test-powershell.ps1
